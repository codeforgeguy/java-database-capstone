name: Lint Frontend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Linters Globally
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard eslint

      - name: Lint HTML Files
        run: |
          htmlhint "app/src/main/resources/static/pages/**/*.html" "app/src/main/resources/static/*.html" "app/src/main/resources/templates/**/*.html" || true

      - name: Lint CSS Files
        run: |
          npx stylelint "app/src/main/resources/static/assets/css/**/*.css" || true

      - name: Lint JavaScript Files
        run: |
          npx eslint "app/src/main/resources/static/js/**/*.js" || true